# Lokale Anpassungen zur offiziellen docker-compose.postgres-tika.yml
# Paperless-Anwendungsoptionen wie URL, Zeitzone und OCR gehören in
# docker-compose.env, das der Basis-Compose bereits beim webserver lädt.
services:
  broker:
    volumes:
      - /data/nas/homeserver01/docker/paperless/redisdata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  db:
    environment:
      POSTGRES_DB: "${PAPERLESS_DBNAME}"
      POSTGRES_USER: "${PAPERLESS_DBUSER}"
      POSTGRES_PASSWORD: "${PAPERLESS_DBPASS}"
    volumes:
      - /data/nas/homeserver01/docker/paperless/pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  webserver:
    depends_on:
      db:
        condition: service_healthy
    environment:
      # === Kritisch ===
      PAPERLESS_DBHOST: ${PAPERLESS_DBHOST}
      PAPERLESS_DBPORT: ${PAPERLESS_DBPORT}
      PAPERLESS_DBNAME: ${PAPERLESS_DBNAME}
      PAPERLESS_DBUSER: ${PAPERLESS_DBUSER}
      PAPERLESS_DBPASS: ${PAPERLESS_DBPASS}
      # === Web-Zugriff / Sicherheit ===
      PAPERLESS_URL: ${PAPERLESS_URL}
      PAPERLESS_CSRF_TRUSTED_ORIGINS: ${PAPERLESS_CSRF_TRUSTED_ORIGINS}
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY}
      # === Admin-Zugang (nur Erststart) ===
      PAPERLESS_ADMIN_USER: ${PAPERLESS_ADMIN_USER}
      PAPERLESS_ADMIN_PASSWORD: ${PAPERLESS_ADMIN_PASSWORD}
      # === Komfort / OCR / Zeitzone ===
      PAPERLESS_TIME_ZONE: ${PAPERLESS_TIME_ZONE}
      PAPERLESS_OCR_LANGUAGE: ${PAPERLESS_OCR_LANGUAGE}
      PAPERLESS_OCR_ROTATE_PAGES_THRESHOLD: ${PAPERLESS_OCR_ROTATE_PAGES_THRESHOLD}
      PAPERLESS_FILENAME_FORMAT: ${PAPERLESS_FILENAME_FORMAT}
    volumes:
      - /data/nas/homeserver01/docker/paperless/data:/usr/src/paperless/data
      - /data/nas/homeserver01/docker/paperless/media:/usr/src/paperless/media
      - /data/nas/homeserver01/docker/paperless/export:/usr/src/paperless/export
      - /data/nas/homeserver01/docker/paperless/consume:/usr/src/paperless/consume

  tika:
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:9998/version || exit 1"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  samba:
    image: dperson/samba
    restart: unless-stopped
    network_mode: host
    volumes:
      - /data/nas/homeserver01/docker/paperless/consume:/mount
    environment:
      PERMISSIONS: "true"
      USER: "${SAMBA_USERPASS}"
      SHARE: "${SAMBA_SHARE_DEF}"
