# docker-compose.override.yml
services:
  db:
    image: docker.io/library/postgres:18
    environment:
      POSTGRES_DB=${PAPERLESS_DBNAME}
      POSTGRES_USER=${PAPERLESS_DBUSER}
      POSTGRES_PASSWORD=${PAPERLESS_DBPASS}
    volumes:
      # Neuer Mount-Pfad ab Postgres 18: /var/lib/postgresql
      - /data/nas/homeserver01/docker/paperless/pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  webserver:
    depends_on:
      db:
        condition: service_healthy
      paperless-ai:
        condition: service_started
    environment:
      # === Kritisch ===
      PAPERLESS_DBHOST=${PAPERLESS_DBHOST}
      PAPERLESS_DBPORT=${PAPERLESS_DBPORT}
      PAPERLESS_DBNAME=${PAPERLESS_DBNAME}
      PAPERLESS_DBUSER=${PAPERLESS_DBUSER}
      PAPERLESS_DBPASS=${PAPERLESS_DBPASS}

      # === Web-Zugriff / Sicherheit ===
      PAPERLESS_URL=${PAPERLESS_URL}
      PAPERLESS_CSRF_TRUSTED_ORIGINS=${PAPERLESS_CSRF_TRUSTED_ORIGINS}

      # === Admin-Zugang (nur Erststart) ===
      PAPERLESS_ADMIN_USER=${PAPERLESS_ADMIN_USER}
      PAPERLESS_ADMIN_PASSWORD=${PAPERLESS_ADMIN_PASSWORD}
      
      # === Komfort / OCR / Zeitzone ===
      PAPERLESS_TIME_ZONE=${PAPERLESS_TIME_ZONE}
      PAPERLESS_OCR_LANGUAGE=${PAPERLESS_OCR_LANGUAGE}
      PAPERLESS_OCR_ROTATE_PAGES_THRESHOLD=${PAPERLESS_OCR_ROTATE_PAGES_THRESHOLD}
      PAPERLESS_FILENAME_FORMAT=${PAPERLESS_FILENAME_FORMAT}
      # === AI-Integration ====
      PAPERLESS_AI_URL=http://paperless-ai:3000
    volumes:
      # Standard-Pfade von Paperless persistieren
      - /data/nas/homeserver01/docker/paperless/data:/usr/src/paperless/data
      - /data/nas/homeserver01/docker/paperless/media:/usr/src/paperless/media
      - /data/nas/homeserver01/docker/paperless/export:/usr/src/paperless/export
      - /data/nas/homeserver01/docker/paperless/consume:/usr/src/paperless/consume
      # optional, falls du Logs persistent willst:
      #- /data/nas/homeserver01/docker/paperless/logs:/usr/src/paperless/logs

  # redis:
    # Redis braucht i. d. R. keine Persistenz für Paperless;
    # wenn gewünscht, kannst du eine AOF/dir-Mount ergänzen.
    # Beispiel (optional):
    # volumes:
    #   - /data/nas/homeserver01/docker/paperless/redis:/data

  # tika:
    # Tika benötigt keine Persistenz
    # keine zusätzlichen Einstellungen nötig

  samba:
    image: dperson/samba
    container_name: paperless-samba
    restart: always
    network_mode: host
    volumes:
      - /data/nas/homeserver01/docker/paperless/consume:/mount
    command: >
      -p
      -u "usrScanner;xEhqDsBuXB79Xw"
      -s "scanner;/mount;yes;no;no;usrScanner;usrScanner"

  paperless-ai:
    image: clusterzx/paperless-ai
    container_name: paperless-ai
    restart: on-failure:5
    ports:
      - "3747:3000"
    volumes:
      - /data/nas/homeserver01/docker/paperless/ai:/app/data:rw
    healthcheck:
      test: ["CMD-SHELL", "timeout 10s bash -c ':> /dev/tcp/127.0.0.1/3000' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
