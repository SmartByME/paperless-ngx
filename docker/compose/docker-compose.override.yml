# docker-compose.override.yml
services:
  db:
    image: docker.io/library/postgres:18
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: change-me
    volumes:
      # Neuer Mount-Pfad ab Postgres 18: /var/lib/postgresql
      - /data/nas/homeserver01/docker/paperless/pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  webserver:
    depends_on:
      db:
        condition: service_healthy
      paperlessngx-ai:
        condition: service_started
    environment:
      # Muss exakt dem DB-Servicenamen entsprechen
      PAPERLESS_DBHOST: db
      PAPERLESS_DBPORT: "5432"
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS: change-me
      # AI-Integration
      PAPERLESS_AI_URL: http://paperless-ai:3000
    volumes:
      # Standard-Pfade von Paperless persistieren
      - /data/nas/homeserver01/docker/paperless/data:/usr/src/paperless/data
      - /data/nas/homeserver01/docker/paperless/media:/usr/src/paperless/media
      - /data/nas/homeserver01/docker/paperless/export:/usr/src/paperless/export
      - /data/nas/homeserver01/docker/paperless/consume:/usr/src/paperless/consume
      # optional, falls du Logs persistent willst:
      #- /data/nas/homeserver01/docker/paperless/logs:/usr/src/paperless/logs

  # redis:
    # Redis braucht i. d. R. keine Persistenz für Paperless;
    # wenn gewünscht, kannst du eine AOF/dir-Mount ergänzen.
    # Beispiel (optional):
    # volumes:
    #   - /data/nas/homeserver01/docker/paperless/redis:/data

  # tika:
    # Tika benötigt keine Persistenz
    # keine zusätzlichen Einstellungen nötig

  paperless-ai:
    image: clusterzx/paperless-ai
    container_name: paperless-ai
    restart: on-failure:5
    ports:
      - "3747:3000"
    volumes:
      - /data/nas/homeserver01/docker/paperless/ai:/app/data:rw
    healthcheck:
      test: ["CMD-SHELL", "timeout 10s bash -c ':> /dev/tcp/127.0.0.1/3000' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
